<script>
function reportActions() {
    return {

        async fetchReports() {
            // Same fetch function as earlier Alpine version
            const form = document.getElementById('filterForm');
            const params = new URLSearchParams(new FormData(form));

            try {
                const res = await fetch(`../api/reports.php?${params.toString()}`);
                const data = await res.json();

                if (!data.success) throw new Error(data.message);

                // Update Alpine state if used with another component
                this.$dispatch("update-reports", data);

            } catch (err) {
                Swal.fire("Error", err.message, "error");
            }
        },

        async printPDF() {
            const element = document.getElementById("reportTable");

            const opt = {
                margin: 1,
                filename: "order-report.pdf",
                image: { type: "jpeg", quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: "in", format: "letter", orientation: "landscape" }
            };

            try {
                await html2pdf().set(opt).from(element).save();
            } catch (error) {
                Swal.fire("Error", "Failed to generate PDF", "error");
            }
        }
    }
}
</script>
